# Production stack, deployed by Dokploy (Compose type, source = this git repo).
# Zero trust: nothing here is published. `cloudflared` opens an outbound tunnel to Cloudflare, and
# Cloudflare Access checks who you are before a request reaches `api` (which checks the Access token
# again, then your passkey session). No Dokploy domain, no open port. See README → Deploy.

x-common: &common
  build: .
  image: zync:latest
  restart: unless-stopped
  environment: &env
    TZ: ${TZ:-UTC}
    WORKSPACES_ROOT: /workspace
    OPENCODE_URL: http://opencode:4096
    # The app's public address (used in notification links), e.g. https://zync.levende.net
    APP_URL: ${APP_URL:-}
  volumes:
    - ${WORKSPACES_HOST_DIR:?set WORKSPACES_HOST_DIR to the host folder holding your workspaces}:/workspace

services:
  api:
    <<: *common
    command: ["api"]
    expose:
      - "3001"
    environment:
      <<: *env
      APP_URL: ${APP_URL:?set APP_URL to the address you open zync at, e.g. https://zync.example.com}
      # Settings → AI server edits opencode's config file through the shared volume.
      ZYNC_OPENCODE_CONFIG: /opencode-config/opencode.json
      # Passkeys and sessions: a volume only this container mounts — never a workspace the AI can read.
      ZYNC_AUTH_DIR: /zync-auth
      # Cloudflare Access (Zero Trust → Access → your application → Overview → AUD tag).
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_EMAIL: ${CF_ACCESS_EMAIL:-}
      # Sign-in alerts (new sign-in, lockouts, passkey changes) go to the same ntfy topic as job runs.
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - ${WORKSPACES_HOST_DIR}:/workspace
      - opencode-config:/opencode-config
      - zync-auth:/zync-auth
    # `default`: opencode and the scheduler. `tunnel`: cloudflared. Not on dokploy-network, so other
    # Dokploy apps can't reach it, and no port is published.
    networks: [default, tunnel]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/zync/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  opencode:
    <<: *common
    command: ["opencode"]
    expose:
      - "4096"
    networks: [default]
    environment:
      <<: *env
      # Provider keys: set whichever you use in Dokploy → Environment. Referenced as {env:…}
      # from opencode/opencode.json (seeded into the opencode-config volume on first start).
      CODEX_ILIAD_API_KEY: ${CODEX_ILIAD_API_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_PROJECT_ID: ${SCW_PROJECT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
    volumes:
      - ${WORKSPACES_HOST_DIR}:/workspace
      - opencode-config:/home/node/.config/opencode
      - opencode-data:/home/node/.local/share/opencode

  scheduler:
    <<: *common
    command: ["scheduler"]
    environment:
      <<: *env
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-30}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    depends_on:
      - opencode

  # The only way in: an outbound tunnel to Cloudflare (Zero Trust → Networks → Tunnels → your
  # tunnel's token), public hostname → http://api:3001, behind an Access application.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN (Cloudflare Zero Trust tunnel)}
    # Its own network, shared with `api` only: whatever route is set in the Cloudflare dashboard,
    # the tunnel can't reach opencode or the scheduler directly.
    networks: [tunnel]
    depends_on:
      - api

volumes:
  zync-auth:
  opencode-config:
  opencode-data:

networks:
  # Not `internal`: cloudflared must reach Cloudflare, and api fetches Access signing keys.
  tunnel: {}
