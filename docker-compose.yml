# Production stack, deployed by Dokploy (Compose type, source = this git repo).
# Domains are set in Dokploy's Domains tab (it adds the Traefik routing); nothing publishes host ports.
#   ai-app.${DOMAIN} → service api, port 3001      (web UI + REST)
#   ai.${DOMAIN}     → service opencode, port 4096 (opencode web, embedded as an iframe by the app)
# See README → Deploy on Dokploy.

x-common: &common
  build: .
  image: zync:latest
  restart: unless-stopped
  environment: &env
    TZ: ${TZ:-UTC}
    WORKSPACES_ROOT: /workspace
    OPENCODE_URL: http://opencode:4096
    APP_URL: https://ai-app.${DOMAIN}
    CHAT_URL: https://ai.${DOMAIN}
    BASIC_AUTH_USERS: ${BASIC_AUTH_USERS:-}
    ALLOW_NO_AUTH: ${ALLOW_NO_AUTH:-0}
  volumes:
    - ${WORKSPACES_HOST_DIR:?set WORKSPACES_HOST_DIR to the host folder holding your workspaces}:/workspace

services:
  api:
    <<: *common
    command: ["api"]
    expose:
      - "3001"
    environment:
      <<: *env
      # Settings → AI server edits opencode's config file through the shared volume.
      ZYNC_OPENCODE_CONFIG: /opencode-config/opencode.json
    volumes:
      - ${WORKSPACES_HOST_DIR}:/workspace
      - opencode-config:/opencode-config
    networks: [default, dokploy-network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  opencode:
    <<: *common
    command: ["opencode"]
    expose:
      - "4096"
    networks: [default, dokploy-network]
    environment:
      <<: *env
      # Provider keys: set whichever you use in Dokploy → Environment. Referenced as {env:…}
      # from opencode/opencode.json (seeded into the opencode-config volume on first start).
      CODEX_ILIAD_API_KEY: ${CODEX_ILIAD_API_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_PROJECT_ID: ${SCW_PROJECT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
    volumes:
      - ${WORKSPACES_HOST_DIR}:/workspace
      - opencode-config:/home/node/.config/opencode
      - opencode-data:/home/node/.local/share/opencode

  scheduler:
    <<: *common
    command: ["scheduler"]
    environment:
      <<: *env
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-30}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    depends_on:
      - opencode

volumes:
  opencode-config:
  opencode-data:

networks:
  dokploy-network:
    external: true
