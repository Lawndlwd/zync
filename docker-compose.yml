# Production stack, deployed by Dokploy (Compose type, source = this git repo).
# All traffic goes through Dokploy's Traefik; nothing publishes host ports.
#   app.${DOMAIN}  → api (web UI + REST)
#   chat.${DOMAIN} → opencode web (embedded as an iframe by the app)
# Both hosts share one basic-auth middleware. See README → Deploy on Dokploy.

x-common: &common
  build: .
  image: zync:latest
  restart: unless-stopped
  environment: &env
    TZ: ${TZ:-UTC}
    WORKSPACES_ROOT: /workspace
    OPENCODE_URL: http://opencode:4096
    APP_URL: https://app.${DOMAIN}
    CHAT_URL: https://chat.${DOMAIN}
    BASIC_AUTH_USERS: ${BASIC_AUTH_USERS:-}
    ALLOW_NO_AUTH: ${ALLOW_NO_AUTH:-0}
  volumes:
    - ${WORKSPACES_HOST_DIR:?set WORKSPACES_HOST_DIR to the host folder holding your workspaces}:/workspace

services:
  api:
    <<: *common
    command: ["api"]
    expose:
      - "3001"
    networks: [default, dokploy-network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.zync-app.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.zync-app.entrypoints=websecure
      - traefik.http.routers.zync-app.tls.certresolver=letsencrypt
      - traefik.http.routers.zync-app.middlewares=zync-auth
      - traefik.http.routers.zync-app-http.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.zync-app-http.entrypoints=web
      - traefik.http.routers.zync-app-http.middlewares=redirect-to-https@file
      - traefik.http.services.zync-app.loadbalancer.server.port=3001
      - traefik.http.middlewares.zync-auth.basicauth.users=${BASIC_AUTH_USERS:-}

  opencode:
    <<: *common
    command: ["opencode"]
    expose:
      - "4096"
    networks: [default, dokploy-network]
    environment:
      <<: *env
      # Provider keys: set whichever you use in Dokploy → Environment.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
    volumes:
      - ${WORKSPACES_HOST_DIR}:/workspace
      - opencode-config:/home/node/.config/opencode
      - opencode-data:/home/node/.local/share/opencode
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.zync-chat.rule=Host(`chat.${DOMAIN}`)
      - traefik.http.routers.zync-chat.entrypoints=websecure
      - traefik.http.routers.zync-chat.tls.certresolver=letsencrypt
      - traefik.http.routers.zync-chat.middlewares=zync-auth
      - traefik.http.routers.zync-chat-http.rule=Host(`chat.${DOMAIN}`)
      - traefik.http.routers.zync-chat-http.entrypoints=web
      - traefik.http.routers.zync-chat-http.middlewares=redirect-to-https@file
      - traefik.http.services.zync-chat.loadbalancer.server.port=4096

  scheduler:
    <<: *common
    command: ["scheduler"]
    environment:
      <<: *env
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-30}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    depends_on:
      - opencode

volumes:
  opencode-config:
  opencode-data:

networks:
  dokploy-network:
    external: true
